	<h1>Car Insurance Registration Form</h1>
	<form method="post">

		<br>
		Email:<input type="Email" id="email" required="yes">
		<br>
		<br>

		<input type="radio" id="gender-f" name="gender" required="yes">
			<label for="gender-f">Female</label>
		<br>
		<br>
		Car Brends:<select id="cars">
			<option>Options</option>
			<option>BMW</option>
			<option>Audio</option>
			<option>Mercedez</option>
		</select>
		<br>
		<br>
		Car Age:<input type="number" id="carage" required="yes">
		<br>
		<br>
		Date of Purchase:<input type="Date" id="dob" required="yes">
		<br>
		<br>
		Password:<input type="password" id="password" required="yes">
		<br>
		<br>
		<button type="submit">submit</button>
	</form>

</body>
